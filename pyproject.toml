[project]
name = "transcrever-app"
version = "0.1.0"
description = "Pipeline local para transcrever audio/video e separar falantes quando viavel."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "faster-whisper>=1.1.1",
    "httpx>=0.28",
    "pyannote-audio>=4.0.5",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "pywebview>=6.2.1",
    "rich>=13.9.0",
    "scikit-learn>=1.9.0",
    "speechbrain>=1.1.0",
    "sqlalchemy>=2.0",
    "typer>=0.15.0",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
diarization = [
    "pyannote.audio>=3.3.0",
]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
transcrever = "transcrever_app.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "EM101",
    "EM102",
    "FBT001",
    "FBT003",
    "PLC0415",
    "PLR0913",
    "S603",
    "TC001",
    "TC003",
    "ISC001",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D103", "INP001", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "ctranslate2",
    "faster_whisper",
    "pyannote.audio",
    "sklearn.cluster",
    "sklearn.metrics",
    "soundfile",
    "speechbrain.inference.speaker",
    "torch",
    "webview",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[dependency-groups]
dev = [
    "httpx2>=2.6.0",
]
